name: Publicar en rama gh-pages (plan B)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
      - name: Subir dist a gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "miau-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicación ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
